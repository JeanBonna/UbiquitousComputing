version: '3.8'

services:
  db:
    image: postgres:15
    container_name: users-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-usersdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-usersdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # API Golang - Instância 1
  golang-api-1:
    build:
      context: ./GolangApi
      dockerfile: Dockerfile
    container_name: golang-api-1
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 8080
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # API Golang - Instância 2
  golang-api-2:
    build:
      context: ./GolangApi
      dockerfile: Dockerfile
    container_name: golang-api-2
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 8080
    env_file:
      - .env
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # API Golang - Instância 3
  golang-api-3:
    build:
      context: ./GolangApi
      dockerfile: Dockerfile
    container_name: golang-api-3
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 8080
    env_file:
      - .env
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # API Node.js - Instância 1
  node-api-1:
    build:
      context: ./NodeApi
      dockerfile: Dockerfile
    container_name: node-api-1
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # API Node.js - Instância 2
  node-api-2:
    build:
      context: ./NodeApi
      dockerfile: Dockerfile
    container_name: node-api-2
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # API Node.js - Instância 3
  node-api-3:
    build:
      context: ./NodeApi
      dockerfile: Dockerfile
    container_name: node-api-3
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-usersdb}?sslmode=disable
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3003:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Gateway com Load Balancer
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      # 3 instâncias Golang + 3 instâncias Node
      UPSTREAMS: http://golang-api-1:8080,http://golang-api-2:8080,http://golang-api-3:8080,http://node-api-1:3000,http://node-api-2:3000,http://node-api-3:3000
      RATE_LIMIT: ${RATE_LIMIT:-30}
      WINDOW_SEC: ${WINDOW_SEC:-60}
      CB_FAIL_THRESHOLD: ${CB_FAIL_THRESHOLD:-3}
      CB_COOLDOWN_SEC: ${CB_COOLDOWN_SEC:-10}
      PORT: 8000
    ports:
      - "8080:8000"
    depends_on:
      - golang-api-1
      - golang-api-2
      - golang-api-3
      - node-api-1
      - node-api-2
      - node-api-3
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge